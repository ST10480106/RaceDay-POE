name: Repository Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Validates that the required project artefacts and README
  # sections exist. This job is fast and reliable — it should always
  # pass once your repo is set up correctly.
  # ---------------------------------------------------------------
  validate-structure:
    name: Validate docs folder and README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "Missing /docs folder"
            exit 1
          fi
          echo "/docs folder found"

      - name: Check for ERD file
        run: |
          if ! ls docs/*[Ee][Rr][Dd]* 1> /dev/null 2>&1; then
            echo "No ERD file found in /docs (filename should contain 'ERD')"
            exit 1
          fi
          echo "ERD file found"

      - name: Check for Endpoint Plan file
        run: |
          if ! ls docs/*[Ee]ndpoint* 1> /dev/null 2>&1; then
            echo "No Endpoint Plan file found in /docs (filename should contain 'Endpoint')"
            exit 1
          fi
          echo "Endpoint Plan file found"

      - name: Check for SQL script
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "No .sql file found in /docs"
            exit 1
          fi
          echo "SQL script found"

      - name: Check README exists and has required sections
        run: |
          if [ ! -f "README.md" ]; then
            echo "README.md is missing from the repo root"
            exit 1
          fi
          for section in "System Description" "User Roles" "CI/CD" "YouTube"; do
            if ! grep -qi "$section" README.md; then
              echo "README.md is missing a section about: $section"
              exit 1
            fi
          done
          echo "README.md contains all required sections"

  # ---------------------------------------------------------------
  # JOB 2 (bonus / optional): Actually spins up SQL Server in a
  # container and runs your script against it, then checks the
  # tables were created. This gives real proof the script executes
  # cleanly — not just that the file exists. Remove this job if it
  # gives you trouble; Job 1 alone already satisfies the brief.
  # ---------------------------------------------------------------
  validate-sql-script:
    name: Execute SQL script against SQL Server
    runs-on: ubuntu-latest
    needs: validate-structure
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg2
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Wait for SQL Server to be ready
        run: |
          for i in {1..10}; do
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" && break
            echo "Waiting for SQL Server..."
            sleep 5
          done

      - name: Run RaceDay SQL script
        run: |
          sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -i docs/RaceDayDB.sql

      - name: Confirm tables were created
        run: |
          sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -d RaceDayDB -Q "SELECT name FROM sys.tables"
